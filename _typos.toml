[default.extend-words]
# Project-specific terms that are not typos
typle = "typle"
fullset = "fullset"

[default.extend-identifiers]
# Pluralized SQL keyword, as in "the DELETEs themselves"
DELETEs = "DELETEs"


[files]
extend-exclude = [
  # Generated files
  "python/src/waymark/proto/**",
  "target/**",
  "**/node_modules/**",
  # Proto generated Rust code
  "crates/lib/proto/src/*.rs",
]
