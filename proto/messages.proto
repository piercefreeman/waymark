syntax = "proto3";

package waymark.messages;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// =============================================================================
// Worker Bridge Communication
// =============================================================================
// These messages handle the core communication between the Rust server and
// Python workers. Workers connect via gRPC streaming and execute actions.

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_ACTION_DISPATCH = 1;  // Server -> Worker: execute this action
  MESSAGE_KIND_ACTION_RESULT = 2;    // Worker -> Server: here's the result
  MESSAGE_KIND_ACK = 3;              // Worker -> Server: message received
  MESSAGE_KIND_HEARTBEAT = 4;        // Bidirectional: keep-alive signal
  MESSAGE_KIND_WORKER_HELLO = 5;     // Worker -> Server: handshake on connect
}

// Universal transport wrapper for all worker bridge messages.
// The `kind` field indicates how to decode the `payload`.
message Envelope {
  uint64 delivery_id = 1;     // Unique ID for correlation (ack, response)
  uint32 partition_id = 2;    // Optional logical grouping
  MessageKind kind = 3;       // Message type discriminator
  bytes payload = 4;          // Encoded message (ActionDispatch, ActionResult, etc.)
}

// Server -> Worker: instruction to execute an action
message ActionDispatch {
  // Action execution details
  string action_name = 4;            // Name of the action function to call
  string module_name = 5;            // Python module containing the action
  WorkflowArguments kwargs = 6;      // Keyword arguments for the action

  // Opaque server correlation metadata; workers echo it untouched.
  // This is the ONLY correlation: wire ids and per-attempt tokens were
  // retired once the action runtime began correlating on metadata alone.
  bytes metadata = 11;

  reserved 1, 2, 3, 7, 8, 9, 10;
  reserved "action_id", "instance_id", "sequence", "timeout_seconds",
      "max_retries", "attempt_number", "dispatch_token";
}

// Worker -> Server: result of action execution
message ActionResult {
  // The action's result, encoded in the value encoding this channel
  // speaks.
  //
  // Whether the action returned or raised is the encoded value's own
  // business: languages differ on whether raising is even a notion, so
  // the framing carries the completion without interpreting it.
  bytes payload = 10;

  uint64 worker_start_ns = 4;        // Perf counter at execution start
  uint64 worker_end_ns = 5;          // Perf counter at execution end
  bytes metadata = 9;                // Opaque server correlation metadata echoed from the dispatch

  reserved 1, 2, 3, 6, 7, 8;
  reserved "action_id", "success", "dispatch_token", "error_type",
      "error_message";
}

// Worker -> Server: acknowledgment of message receipt
message Ack {
  uint64 acked_delivery_id = 1;
}

// Worker -> Server: initial handshake when connecting
message WorkerHello {
  uint64 worker_id = 1;
}

// =============================================================================
// Value Framing
// =============================================================================
// Named arguments at the transport framing level.  The names stay
// proto-visible; each value is opaque encoded bytes whose format is
// the producing language's own business (currently a serialized
// `waymark.python_value.WorkflowArgumentValue`, see python_value.proto).

message WorkflowArgument {
  string key = 1;
  bytes value = 2;
}

message WorkflowArguments {
  repeated WorkflowArgument arguments = 1;
}

// =============================================================================
// Workflow Registration
// =============================================================================
// Messages for registering workflows and starting instances.

// Workflow registration containing the IR program
message WorkflowRegistration {
  string workflow_name = 1;
  bytes ir = 2;                      // Serialized IR program (from ast.proto)
  string ir_hash = 3;                // Hash of the IR for immutability checks
  string workflow_version = 7;       // User-defined version identifier
  WorkflowArguments initial_context = 4;
  // Priority for queue ordering (higher values are processed first, default 0)
  optional int32 priority = 6;

  // Field 5 was `bool concurrent`, retired with the legacy DAG runner.
  reserved 5;
  reserved "concurrent";
}

message RegisterWorkflowRequest {
  WorkflowRegistration registration = 1;
}

message RegisterWorkflowResponse {
  string workflow_version_id = 1;
  string workflow_instance_id = 2;
}

message RegisterWorkflowBatchRequest {
  WorkflowRegistration registration = 1;
  // Total number of instances to create when inputs_list is empty.
  uint32 count = 2;
  // Base inputs to apply to each instance when inputs_list is empty.
  WorkflowArguments inputs = 3;
  // Per-instance inputs (overrides count/inputs when provided).
  repeated WorkflowArguments inputs_list = 4;
  // Batch size for database inserts, clamped to a server-side maximum;
  // 0 means the server default.
  uint32 batch_size = 5;
  // Whether to return instance IDs in the response.
  bool include_instance_ids = 6;
}

message RegisterWorkflowBatchResponse {
  string workflow_version_id = 1;
  repeated string workflow_instance_ids = 2;
  uint32 queued = 3;
}

message WaitForInstanceRequest {
  string instance_id = 1;
  double poll_interval_secs = 2;
}

message WaitForInstanceResponse {
  bytes payload = 1;
}

// =============================================================================
// In-memory workflow execution (local broker)
// =============================================================================

// Client -> server messages for workflow execution streaming.
message WorkflowStreamRequest {
  oneof kind {
    WorkflowRegistration registration = 1;
    ActionResult action_result = 2;
  }
  // Skip sleep/backoff delays in in-memory execution (e.g., pytest).
  bool skip_sleep = 3;
}

// Server -> client final workflow result payload.
message WorkflowExecutionResult {
  bytes payload = 1;
}

// Server -> client messages for workflow execution streaming.
message WorkflowStreamResponse {
  oneof kind {
    ActionDispatch action_dispatch = 1;
    WorkflowExecutionResult workflow_result = 2;
  }
}

// =============================================================================
// Workflow Schedules
// =============================================================================
// Messages for scheduling workflows to run on a recurring basis.

enum ScheduleStatus {
  SCHEDULE_STATUS_UNSPECIFIED = 0;
  SCHEDULE_STATUS_ACTIVE = 1;
  SCHEDULE_STATUS_PAUSED = 2;
}

message ScheduleDefinition {
  reserved 1;
  reserved "type";
  oneof schedule {
    // Standard 5-field cron expression (e.g., "0 * * * *"); a 6-field
    // expression with a seconds column is accepted, a 7-field
    // expression with a year column is rejected.
    string cron_expression = 2;
    // Fixed interval between runs, in seconds. Must be positive.
    int64 interval_seconds = 3;
  }
  // Random delay in [0, jitter_seconds] added to each computed run.
  int64 jitter_seconds = 4;
  // If false (default), a due run is skipped (the schedule still
  // advances) while the previous instance is still running.
  bool allow_duplicate = 5;
}

message RegisterScheduleRequest {
  reserved 1, 3, 6, 7;
  reserved "workflow_name", "inputs", "priority", "allow_duplicate";
  ScheduleDefinition schedule = 2;
  // Required: names the workflow, pins the compiled executable at
  // registration time, and its initial_context carries the arguments
  // for every scheduled run.
  WorkflowRegistration registration = 4;
  // Required: the schedule's name — the sole key. The namespace is
  // flat; re-registering an existing name re-points it.
  string schedule_name = 5;
}

message RegisterScheduleResponse {
  reserved 1;
  reserved "schedule_id";
  // When the schedule will first fire.
  google.protobuf.Timestamp next_run_at = 2;
}

message UpdateScheduleStatusRequest {
  reserved 1;
  reserved "workflow_name";
  ScheduleStatus status = 2;
  // Required: name of the schedule to update.
  string schedule_name = 3;
}

message DeleteScheduleRequest {
  reserved 1;
  reserved "workflow_name";
  // Required: name of the schedule to delete.
  string schedule_name = 2;
}

message ListSchedulesRequest {
  // Filter by status; SCHEDULE_STATUS_UNSPECIFIED returns all schedules.
  ScheduleStatus status_filter = 1;
}

message ScheduleInfo {
  reserved 1, 3, 4, 5, 8, 10, 11, 13, 14;
  reserved "id", "schedule_type", "cron_expression", "interval_seconds",
      "last_run_at", "created_at", "updated_at", "jitter_seconds",
      "allow_duplicate";
  // The pinned executable's workflow name.
  string workflow_name = 2;
  ScheduleStatus status = 6;
  google.protobuf.Timestamp next_run_at = 7;
  string last_instance_id = 9;      // Empty if never fired
  string schedule_name = 12;
  ScheduleDefinition definition = 15;
}

message ListSchedulesResponse {
  repeated ScheduleInfo schedules = 1;
}

// =============================================================================
// gRPC Service Definitions
// =============================================================================

// Bidirectional streaming service for worker communication.
// Workers connect and maintain a persistent stream for action dispatch/results.
service WorkerBridge {
  rpc Attach(stream Envelope) returns (stream Envelope);
}

// Workflow management service for client operations.
service WorkflowService {
  rpc RegisterWorkflow(RegisterWorkflowRequest) returns (RegisterWorkflowResponse);
  rpc RegisterWorkflowBatch(RegisterWorkflowBatchRequest)
      returns (RegisterWorkflowBatchResponse);
  rpc WaitForInstance(WaitForInstanceRequest) returns (WaitForInstanceResponse);
  rpc ExecuteWorkflow(stream WorkflowStreamRequest)
      returns (stream WorkflowStreamResponse);
  // Schedule management
  rpc RegisterSchedule(RegisterScheduleRequest) returns (RegisterScheduleResponse);
  rpc UpdateScheduleStatus(UpdateScheduleStatusRequest) returns (google.protobuf.Empty);
  rpc DeleteSchedule(DeleteScheduleRequest) returns (google.protobuf.Empty);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
}
