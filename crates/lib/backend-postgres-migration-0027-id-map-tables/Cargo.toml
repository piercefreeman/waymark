[package]
name = "waymark-backend-postgres-migration-0027-id-map-tables"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-migrations-engine-migration = { workspace = true }
waymark-migrations-rust-code = { workspace = true }

# Pinned here, apart from the workspace's table: what the migration reads
# and writes is frozen with it.
rmpv = "=1.3.1"
sqlx = { workspace = true, features = ["postgres", "uuid"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
waymark-support-integration = { workspace = true }
waymark-support-test = { workspace = true }

sqlx = { workspace = true, features = ["runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lib]
doctest = false
