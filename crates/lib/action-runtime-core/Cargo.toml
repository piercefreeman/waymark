[package]
name = "waymark-action-runtime-core"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-action-core = { workspace = true }
waymark-vm-runtime-exception = { workspace = true }

nonempty-collections = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }

[features]
default = []

serde = ["dep:serde", "serde/derive", "waymark-vm-runtime-exception/serde"]

[lib]
doctest = false
