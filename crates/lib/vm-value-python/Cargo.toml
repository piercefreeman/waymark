[package]
name = "waymark-vm-value-python"
edition = "2024"
version.workspace = true
publish.workspace = true

[features]
default = []

serde = ["dep:serde", "waymark-vm-value/serde", "nonempty-collections/serde"]

[dependencies]
waymark-observability-vm-value-display = { workspace = true }
waymark-vm-interpreter-pureset = { workspace = true }
waymark-vm-runtime-exception = { workspace = true }
waymark-vm-value = { workspace = true }

nonempty-collections = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
waymark-vm-bytecode = { workspace = true }
waymark-vm-exception-handler = { workspace = true }
waymark-vm-instructions-coreset = { workspace = true }
waymark-vm-instructions-excset = { workspace = true }
waymark-vm-instructions-extcallset = { workspace = true }
waymark-vm-instructions-pureset = { workspace = true }
waymark-vm-interpreter-composite = { workspace = true }
waymark-vm-interpreter-coreset = { workspace = true }
waymark-vm-interpreter-excset = { workspace = true }
waymark-vm-interpreter-extcallset = { workspace = true }
waymark-vm-interpreter-fullset = { workspace = true }
waymark-vm-interpreter-pureset = { workspace = true }
waymark-vm-runtime = { workspace = true }
waymark-vm-runtime-core = { workspace = true }
waymark-vm-runtime-exception = { workspace = true }
waymark-vm-runtime-promise-core = { workspace = true }
waymark-vm-runtime-test = { workspace = true }

indexmap = { workspace = true }
static_assertions = { workspace = true }
typed_floats = { workspace = true }
