[package]
name = "waymark-postgres-bringup"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-migrations-engine = { workspace = true }
waymark-migrations-engine-assertion = { workspace = true }
waymark-migrations-engine-backend = { workspace = true }
waymark-migrations-engine-backend-sqlx-postgres = { workspace = true }
waymark-migrations-engine-migration = { workspace = true }
waymark-nonzero-duration = { workspace = true }
waymark-postgres-config = { workspace = true }
waymark-secret-string = { workspace = true }
waymark-sqlx-postgres-schema-pool = { workspace = true }

derive-where = { workspace = true }
futures-util = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync"] }
tokio-util = { workspace = true }

[dev-dependencies]
waymark-migrations-sql-file = { workspace = true }
waymark-support-integration = { workspace = true }
waymark-support-test = { workspace = true }

const_format = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true }
