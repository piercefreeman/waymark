[package]
name = "waymark-postgres-bringup"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-nonzero-duration = { workspace = true }
waymark-postgres-config = { workspace = true }
waymark-secret-string = { workspace = true }
waymark-sqlx-postgres-schema-pool = { workspace = true }

sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
thiserror = { workspace = true }

[dev-dependencies]
waymark-support-integration = { workspace = true }
waymark-support-test = { workspace = true }

const_format = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
