[package]
name = "waymark-vm-instructions-fullset"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-blanket-impl-macros = { workspace = true }
waymark-vm-instructions-coreset = { workspace = true }
waymark-vm-instructions-extcallset = { workspace = true }
waymark-vm-instructions-pureset = { workspace = true }

derive-where = { workspace = true }
derive_more = { workspace = true, features = ["from"] }
serde = { workspace = true, optional = true }

[features]
serde = [
  "dep:serde",
  "serde/derive",
  "waymark-vm-instructions-coreset/serde",
  "waymark-vm-instructions-extcallset/serde",
  "waymark-vm-instructions-pureset/serde",
]
