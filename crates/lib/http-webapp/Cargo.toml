[package]
name = "waymark-http-webapp"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-webapp-assets = { workspace = true }

axum = { workspace = true }
hex = { workspace = true }
rust-embed = { workspace = true, features = ["mime-guess"] }

[dev-dependencies]
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lib]
doctest = false

[package.metadata.cargo-shear]
# Only enables the `mime-guess` feature behind `Metadata::mimetype`.
ignored = ["rust-embed"]
