[package]
name = "waymark-http-webapp"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
rust-embed = { workspace = true, features = ["debug-embed", "deterministic-timestamps", "interpolate-folder-path", "mime-guess"] }

[dev-dependencies]
waymark-http-api = { workspace = true }
waymark-http-healthz = { workspace = true }

aide = { workspace = true }
http-body-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lib]
doctest = false
