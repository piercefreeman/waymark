[package]
name = "waymark-action-effect-reconciler"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-action-core = { workspace = true, features = ["serde"] }
waymark-action-effect-reconciler-backend = { workspace = true }
waymark-action-runtime-core = { workspace = true }
waymark-action-runtime-metadata = { workspace = true }
waymark-extcall-reconciler-core = { workspace = true }
waymark-nonzero-duration = { workspace = true }
waymark-state-manager-core = { workspace = true }
waymark-vm-codec-core = { workspace = true }
waymark-vm-runtime-effect = { workspace = true }
waymark-vm-runtime-promise-core = { workspace = true }

chrono = { workspace = true, default-features = false, features = ["clock"] }
nonempty-collections = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
waymark-vm-codec-rmp = { workspace = true }

tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lib]
doctest = false
