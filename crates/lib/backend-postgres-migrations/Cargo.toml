[package]
name = "waymark-backend-postgres-migrations"
version.workspace = true
publish.workspace = true
edition = "2024"

[dependencies]
waymark-backend-postgres-migration-0027-id-map-tables = { workspace = true }
waymark-migrations-engine-backend-sqlx-postgres = { workspace = true }
waymark-migrations-source = { workspace = true }

sqlx = { workspace = true, features = ["postgres"] }

[dev-dependencies]
waymark-migrations-engine = { workspace = true }
waymark-migrations-engine-backend = { workspace = true }
waymark-migrations-engine-migration = { workspace = true }
waymark-nonzero-duration = { workspace = true }
waymark-postgres-bringup = { workspace = true }
waymark-postgres-config = { workspace = true }
waymark-support-integration = { workspace = true }
waymark-support-test = { workspace = true }

sha2 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }

[lib]
doctest = false
