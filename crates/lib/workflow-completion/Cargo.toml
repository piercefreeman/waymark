[package]
name = "waymark-workflow-completion"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-batcher = { workspace = true }
waymark-vm-codec-core = { workspace = true }
waymark-vm-driver-core = { workspace = true }
waymark-vm-interpreter-coreset = { workspace = true }
waymark-vm-runtime-effect = { workspace = true }
waymark-vm-runtime-exception = { workspace = true }
waymark-workflow-completion-backend = { workspace = true }

nonempty-collections = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

[dev-dependencies]
waymark-nonzero-duration = { workspace = true }

tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
