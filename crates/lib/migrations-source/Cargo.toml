[package]
name = "waymark-migrations-source"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-migrations-engine-migration = { workspace = true }
waymark-migrations-rust-code = { workspace = true }
waymark-migrations-sql-file = { workspace = true }

derive-where = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
waymark-support-integration = { workspace = true }
waymark-support-test = { workspace = true }

mockall = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lib]
doctest = false
