[package]
name = "waymark-api-essential-metrics-http"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-essential-metrics-core = { workspace = true }
waymark-essential-metrics-query-backend = { workspace = true }
waymark-http-api-types = { workspace = true }
waymark-ids = { workspace = true }

aide = { workspace = true, features = ["axum-json", "axum-query"] }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
schemars = { workspace = true, features = ["chrono04"] }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lib]
doctest = false
