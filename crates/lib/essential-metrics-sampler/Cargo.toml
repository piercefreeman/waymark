[package]
name = "waymark-essential-metrics-sampler"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-essential-metrics-core = { workspace = true }
waymark-lossy-batcher = { workspace = true }
waymark-nonzero-duration = { workspace = true }

chrono = { workspace = true, default-features = false, features = ["clock"] }
metrics = { workspace = true }
metrics-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
nonempty-collections = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
