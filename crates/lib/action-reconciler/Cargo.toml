[package]
name = "waymark-action-reconciler"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-action-core = { workspace = true, features = ["serde"] }
waymark-action-reconciler-backend = { workspace = true }
waymark-action-runtime-core = { workspace = true }
waymark-action-runtime-metadata = { workspace = true }
waymark-extcall-reconciler-core = { workspace = true }
waymark-vm-codec-core = { workspace = true }
waymark-vm-driver-core = { workspace = true }
waymark-vm-runtime-effect = { workspace = true }
waymark-vm-runtime-promise-core = { workspace = true }

nonempty-collections = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
waymark-vm-codec-rmp = { workspace = true }
waymark-vm-value = { workspace = true, features = ["serde"] }

mockall = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
