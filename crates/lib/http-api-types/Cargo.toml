[package]
name = "waymark-http-api-types"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-cursor-core = { workspace = true }
waymark-ids = { workspace = true, features = ["serde"] }
waymark-nonzero-duration = { workspace = true }
waymark-query-limit = { workspace = true }
waymark-timestamp = { workspace = true, features = ["serde"] }

chrono = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
uuid = { workspace = true }

[lib]
doctest = false
