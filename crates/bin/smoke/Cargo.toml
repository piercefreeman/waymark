[package]
name = "waymark-smoke"
version.workspace = true
publish.workspace = true
edition = "2024"

[dependencies]
waymark-fn-main-common = { workspace = true }
waymark-smoke-sources = { workspace = true }
waymark-system-vm = { workspace = true, features = ["serde"] }
waymark-transient-execution-bringup = { workspace = true }
waymark-transient-execution-worker-pool-bringup = { workspace = true }
waymark-vm-ast-old = { workspace = true }
waymark-vm-ast-old-fmt = { workspace = true }
waymark-vm-ast-old-proto = { workspace = true }
waymark-worker-core = { workspace = true }
waymark-worker-python = { workspace = true }
waymark-worker-remote-bringup = { workspace = true }
waymark-worker-remote-pool = { workspace = true }
waymark-workflow-completion-core = { workspace = true }

clap = { workspace = true, features = ["derive"] }
color-eyre = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
