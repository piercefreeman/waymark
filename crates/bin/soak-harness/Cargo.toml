[package]
name = "waymark-soak-harness"
version.workspace = true
publish.workspace = true
edition = "2024"

[dependencies]
waymark-backend-postgres = { workspace = true }
waymark-backend-postgres-migrations = { workspace = true }
waymark-counter-rate = { workspace = true, features = ["chrono"] }
waymark-essential-metrics-core = { workspace = true }
waymark-essential-metrics-query-backend = { workspace = true }
waymark-fn-main-common = { workspace = true }
waymark-ids = { workspace = true }
waymark-ir-parser = { workspace = true }
waymark-nonzero-duration = { workspace = true }
waymark-observability-store-postgres = { workspace = true }
waymark-secret-string = { workspace = true }
waymark-sqlx-postgres-schema-pool = { workspace = true }
waymark-system-vm = { workspace = true, features = ["serde"] }
waymark-vm-ast-old-proto = { workspace = true }
waymark-vm-codec-rmp = { workspace = true }
waymark-vm-compiler-for-ast-old-core = { workspace = true }
waymark-vm-runtime-builder = { workspace = true }
waymark-workflow-service-vm-executables = { workspace = true }
waymark-workflow-service-vm-runtimes = { workspace = true }
waymark-workflow-service-vm-runtimes-backend = { workspace = true }

chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
color-eyre = { workspace = true }
nonempty-collections = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "signal"] }
tracing = { workspace = true }
uuid = { workspace = true }
