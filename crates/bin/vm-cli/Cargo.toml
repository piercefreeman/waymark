[package]
name = "waymark-vm-cli"
edition = "2024"
version.workspace = true
publish.workspace = true

[dependencies]
waymark-action-core = { workspace = true }
waymark-fn-main-common = { workspace = true }
waymark-system-vm = { workspace = true, features = ["serde"] }
waymark-transient-execution-bringup = { workspace = true }
waymark-transient-execution-worker-pool-bringup = { workspace = true }
waymark-vm-ast-old = { workspace = true }
waymark-vm-ast-old-helpers = { workspace = true }
waymark-vm-bytecode = { workspace = true }
waymark-vm-bytecode-core = { workspace = true }
waymark-vm-instructions-coreset = { workspace = true }
waymark-vm-instructions-extcallset = { workspace = true }
waymark-vm-instructions-pureset = { workspace = true }
waymark-vm-runtime-core = { workspace = true }
waymark-worker-core = { workspace = true }
waymark-worker-python = { workspace = true }
waymark-worker-remote-bringup = { workspace = true }
waymark-worker-remote-pool = { workspace = true }
waymark-workflow-completion-core = { workspace = true }

clap = { workspace = true, features = ["derive"] }
index_type = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
